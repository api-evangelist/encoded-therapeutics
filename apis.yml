name: Encoded Therapeutics
description: 'Encoded Therapeutics is a clinical-stage biopharmaceutical company developing
  next-generation gene therapies for neurological disorders, translating precision genetic
  science into transformative genetic medicines. Its Genetic Medicines Product Engine
  supports a pipeline led by ETX101, an investigational AAV gene therapy for SCN1A-positive
  Dravet Syndrome, alongside additional research programs. Backed by GV, Menlo Ventures,
  and SoftBank Vision Fund, the company is added to the API Evangelist network as a
  life-sciences profile. As a clinical-stage therapeutics company it publishes no public
  developer API, SDK, or developer portal; this profile captures its identity for the network.'
